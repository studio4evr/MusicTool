<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicTool – Audio to MIDI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%237c5cff%27/%3E%3Crect x=%273%27 y=%274%27 width=%276%27 height=%272%27 fill=%27white%27/%3E%3Crect x=%277%27 y=%278%27 width=%276%27 height=%272%27 fill=%27white%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>MusicTool</h1>
    <p class="sub">AI transcription of electronic music into multi-track MIDI: drums, bass and synths.</p>
  </header>

  <section id="upload" class="card">
    <label id="drop" for="file">
      <input id="file" type="file" accept=".wav,.mp3,.flac,.ogg,.aif,.aiff,.m4a,audio/*" hidden>
      <strong>Drop an audio file here</strong>
      <span>or click to choose (WAV, MP3, FLAC, OGG, AIFF)</span>
      <span id="filename" class="filename"></span>
    </label>

    <details>
      <summary>Options</summary>
      <div class="grid">
        <label>Stem separation
          <select id="separation">
            <option value="auto" selected>Auto (best installed)</option>
            <option value="demucs-ft" data-needs="neural_separation">Demucs v4 fine-tuned (best)</option>
            <option value="demucs" data-needs="neural_separation">Demucs v4 (faster)</option>
            <option value="hpss">Fast DSP (no GPU)</option>
          </select>
        </label>
        <label>Drum engine
          <select id="drum_engine">
            <option value="auto" selected>Auto (best installed)</option>
            <option value="ensemble" data-needs="adtof">DrumSep + ADTOF (best)</option>
            <option value="drumsep" data-needs="neural_separation">DrumSep kit separation</option>
            <option value="adtof" data-needs="adtof">ADTOF neural net (fast)</option>
            <option value="dsp">DSP onset classifier</option>
          </select>
        </label>
        <label>Quantise
          <select id="quantize">
            <option value="16" selected>1/16</option>
            <option value="32">1/32</option>
            <option value="8">1/8</option>
            <option value="0">Off</option>
          </select>
        </label>
        <label>Tempo (BPM)
          <input id="bpm" type="number" min="40" max="250" step="0.01" placeholder="auto">
        </label>
        <label>Synth engine
          <select id="synth_engine">
            <option value="auto" selected>Auto (best installed)</option>
            <option value="vote" data-needs="yourmt3">Voting: Basic Pitch + 4 YourMT3+ passes (best)</option>
            <option value="hybrid" data-needs="yourmt3">Split by instrument: Basic Pitch + YourMT3+ (faster)</option>
            <option value="layers">Lead + pad layers (Basic Pitch)</option>
            <option value="yourmt3" data-needs="yourmt3">YourMT3+ only</option>
            <option value="basic-pitch">Basic Pitch, one Synths track</option>
          </select>
        </label>
        <label>Bass engine
          <select id="mono_engine">
            <option value="auto" selected>Auto (best installed)</option>
            <option value="yourmt3" data-needs="yourmt3">YourMT3+ (best)</option>
            <option value="crepe" data-needs="crepe">CREPE neural net</option>
            <option value="pyin">pYIN (no GPU)</option>
            <option value="basic-pitch">Basic Pitch neural net</option>
          </select>
        </label>
        <label>Note sensitivity <output id="onset_out">0.50</output>
          <input id="onset_threshold" type="range" min="0.1" max="0.9" step="0.05" value="0.5" data-invert>
        </label>
        <label>Drum sensitivity <output id="drum_out">0.50</output>
          <input id="drum_sensitivity" type="range" min="0" max="1" step="0.05" value="0.5">
        </label>
        <label>Min note length (ms)
          <input id="min_note_ms" type="number" min="10" max="1000" step="10" placeholder="auto">
        </label>
        <fieldset>
          <legend>Tracks</legend>
          <label class="check"><input id="drums" type="checkbox" checked> Drums</label>
          <label class="check"><input id="bass" type="checkbox" checked> Bass</label>
          <label class="check"><input id="melodic" type="checkbox" checked> Synths / chords</label>
        </fieldset>
      </div>
    </details>

    <button id="go" disabled>Transcribe to MIDI</button>
  </section>

  <section id="progress" class="card" hidden>
    <div class="stage" id="stage">Uploading…</div>
    <div class="bar"><div id="barfill"></div></div>
  </section>

  <section id="error" class="card error" hidden></section>

  <section id="result" class="card" hidden>
    <div class="result-head">
      <div>
        <h2 id="title"></h2>
        <div class="meta" id="meta"></div>
        <div class="meta engines" id="engines"></div>
      </div>
      <a id="dl-all" class="button" download>Download MIDI</a>
    </div>

    <div class="transport">
      <button id="play" class="secondary">▶ Play</button>
      <label class="check"><input id="hear-midi" type="checkbox" checked> MIDI preview</label>
      <label class="check"><input id="hear-audio" type="checkbox"> Original audio</label>
      <span id="time" class="time">0:00</span>
    </div>

    <div class="roll-wrap"><canvas id="roll"></canvas></div>
    <ul id="tracks" class="tracks"></ul>
    <div id="stems" class="stems" hidden>
      <span class="meta">Separated audio stems:</span>
      <span id="stem-links"></span>
    </div>
  </section>

  <footer>
    Stem separation by <a href="https://github.com/facebookresearch/demucs">Demucs</a>
    (via <a href="https://github.com/nomadkaraoke/python-audio-separator">audio-separator</a>),
    drums by <a href="https://github.com/MZehren/ADTOF">ADTOF</a>,
    bass by <a href="https://github.com/maxrmorrison/torchcrepe">CREPE</a>,
    synths by <a href="https://github.com/spotify/basic-pitch">Spotify Basic Pitch</a>.
  </footer>
</main>
<audio id="audio" preload="auto"></audio>
<script src="/static/app.js"></script>
</body>
</html>
